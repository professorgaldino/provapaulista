<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Desafio Villani</title><link rel="stylesheet" href="style.css"></head><body>
<div class="bg"></div><main class="app">
<section id="start" class="card hero"><div class="badge">⚡ DESAFIO VILLANI</div><h1>Preparado para subir no ranking?</h1><p>Escolha sua turma, responda ao desafio e compare seu resultado com a galera.</p><form id="startForm"><label>Seu nome<input id="name" maxlength="50" required placeholder="Digite seu nome"></label><label>Turma<select id="classroom" required><option value="">Escolha sua turma</option><option value="7B">7º B — Educação Financeira</option><option value="7C">7º C — Educação Financeira</option><option value="8B">8º B — Educação Financeira</option><option value="8C">8º C — Educação Financeira</option><option value="9B">9º B — Matemática</option><option value="9C">9º C — Matemática</option></select></label><button>Começar desafio 🚀</button></form></section>
<section id="quiz" class="hidden"><div class="top"><div><small id="who"></small><h2 id="subject"></h2></div><div class="progressText"><b id="qnum"></b><span id="scoreLive">🔥 0 pts</span></div></div><div class="progress"><i id="bar"></i></div><div id="questionCard" class="card question"></div></section>
<section id="result" class="hidden card result"><div class="trophy">🏆</div><h1 id="resultTitle"></h1><div class="score"><b id="finalScore"></b><span>pontos</span></div><p id="resultText"></p><div class="actions"><button id="shareFriend">Compartilhar com amigos 📲</button><button id="shareTeacher" class="secondary">Enviar ao professor no WhatsApp</button><button id="again" class="ghost">Tentar novamente</button></div></section>
<section id="ranking" class="card ranking"><div class="rankingHead"><div><span>🏅</span><div><h2>Ranking</h2><small id="rankingLabel">Escolha uma turma para visualizar</small></div></div><button id="refresh" class="icon">↻</button></div><div id="rankingList" class="rankingList"><p class="muted">O ranking aparecerá aqui.</p></div></section>
</main><script type="module" src="app.js"></script></body></html>
